name: JustMark
options:
  minimumXcodeGenVersion: 2.38.0
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
settings:
  base:
    PRODUCT_NAME: JustMark
    PRODUCT_BUNDLE_IDENTIFIER: com.justmark.mac
    MARKETING_VERSION: "0.1.8"
    CURRENT_PROJECT_VERSION: "8"
    GENERATE_INFOPLIST_FILE: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_VERSION: "5.10"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    INFOPLIST_KEY_CFBundleDisplayName: JustMark
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    INFOPLIST_KEY_NSHumanReadableCopyright: ""
packages:
  DownGFM:
    url: https://github.com/stackotter/Down-gfm
    from: 0.12.0
targets:
  JustMark:
    type: application
    platform: macOS
    dependencies:
      - package: DownGFM
        product: Down
    sources:
      - path: Sources
        excludes:
          - "**/.DS_Store"
      - path: Resources
    settings:
      base:
        PRODUCT_MODULE_NAME: JustMark
        SWIFT_EMIT_LOC_STRINGS: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Resources/Info.plist
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: JustMark.entitlements
    scheme:
      gatherCoverageData: false
